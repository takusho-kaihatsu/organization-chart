<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>組織図NEO</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Loading Overlay -->
<div id="loading-overlay">
  <div style="font-size:1.1rem;font-weight:bold;color:#d4a017;">組織図NEO 読み込み中...</div>
  <div id="loading-bar-wrap">
    <div id="loading-bar"></div>
  </div>
  <div id="loading-text">データを取得しています...</div>
</div>

<!-- Tab Navigation -->
<nav id="tab-nav">
  <button class="dept-tab" data-tab="all">全社一覧</button>
  <!-- 部署タブはJSで生成 -->
</nav>

<!-- Toolbar -->
<div id="toolbar">
  <button id="print-btn">印刷 / PDF保存</button>
  <div id="print-options" style="display:none;">
    <span style="font-weight:bold;margin-right:8px;">印刷部署:</span>
    <div id="print-dept-checklist" class="d-inline-flex flex-wrap gap-1"></div>
  </div>
</div>

<!-- Main Content -->
<div id="main-content">

  <!-- 全社一覧 -->
  <div id="all-depts-view" class="dept-view">
    <div id="all-depts-container"></div>
  </div>

  <!-- 部署別ビュー（JSで生成） -->
  <div id="dept-views-container"></div>

</div>

<!-- Member Detail Modal -->
<div class="modal fade" id="memberModal" tabindex="-1" aria-labelledby="memberModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header" style="border-bottom:2px solid #d4a017;">
        <h5 class="modal-title" id="memberModalLabel">メンバー詳細</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="閉じる"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <!-- 写真 -->
          <div class="col-auto modal-photo-col">
            <img id="modal-photo" src="" alt="">
          </div>
          <!-- 情報 -->
          <div class="col">
            <div class="modal-member-name" id="modal-name"></div>
            <div class="text-muted mb-2" id="modal-role" style="font-size:0.95rem;"></div>

            <div class="modal-field-row">
              <span class="modal-field-label">所属課</span>
              <span class="modal-field-value" id="modal-section"></span>
            </div>
            <div class="modal-field-row">
              <span class="modal-field-label">上司</span>
              <span class="modal-field-value" id="modal-boss"></span>
            </div>

            <hr style="border-color:#d4a017;">

            <div class="modal-field-row">
              <span class="modal-field-label">図鑑番号</span>
              <span class="modal-field-value">
                <span class="modal-number-badge" id="modal-number"></span>
              </span>
            </div>
            <div class="modal-field-row">
              <span class="modal-field-label">タイプ</span>
              <span class="modal-field-value" id="modal-type"></span>
            </div>
            <div class="modal-field-row">
              <span class="modal-field-label">特性</span>
              <span class="modal-field-value" id="modal-ability"></span>
            </div>
            <div class="modal-field-row">
              <span class="modal-field-label">生息地</span>
              <span class="modal-field-value" id="modal-habitat"></span>
            </div>
            <div class="modal-field-row">
              <span class="modal-field-label">説明</span>
              <span class="modal-field-value" id="modal-desc"></span>
            </div>
            <div class="modal-field-row">
              <span class="modal-field-label">所持資格</span>
              <span class="modal-field-value" id="modal-qual"></span>
            </div>
            <div class="modal-field-row">
              <span class="modal-field-label">プロフィール</span>
              <span class="modal-field-value" id="modal-profile"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="js/modal.js"></script>
<script src="js/print.js"></script>
<script>
(async function () {
  const loadingOverlay = document.getElementById('loading-overlay');
  const loadingBar     = document.getElementById('loading-bar');
  const loadingText    = document.getElementById('loading-text');
  const tabNav         = document.getElementById('tab-nav');
  const deptViews      = document.getElementById('dept-views-container');

  // 部署タブ・ビュー生成
  DEPT_ORDER.forEach(name => {
    const btn = document.createElement('button');
    btn.className = 'dept-tab';
    btn.dataset.tab = name;
    btn.textContent = name;
    tabNav.appendChild(btn);

    const view = document.createElement('div');
    view.className = 'dept-view';
    view.id = `view-${CSS.escape(name)}`;
    view.dataset.dept = name;
    deptViews.appendChild(view);
  });

  // タブ切り替え
  function switchTab(tab) {
    document.querySelectorAll('.dept-tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    document.querySelectorAll('.dept-view').forEach(v => v.classList.remove('active'));
    document.getElementById('all-depts-view').classList.toggle('active', tab === 'all');

    if (tab !== 'all') {
      const view = document.getElementById(`view-${CSS.escape(tab)}`);
      if (view) view.classList.add('active');
    }

    document.dispatchEvent(new CustomEvent('tabChanged', { detail: tab }));
  }

  tabNav.addEventListener('click', e => {
    const btn = e.target.closest('.dept-tab');
    if (btn) switchTab(btn.dataset.tab);
  });

  // データ取得
  const allData = await fetchAllDepts((loaded, total, name) => {
    const pct = Math.round((loaded / total) * 100);
    loadingBar.style.width = pct + '%';
    loadingText.textContent = `${name} 取得完了 (${loaded}/${total})`;

    // 取得完了した部署をレンダリング
    const view = document.getElementById(`view-${CSS.escape(name)}`);
    if (view && !view.dataset.rendered) {
      renderDept(name, deptCache[name], view);
      view.dataset.rendered = '1';
    }
  });

  // 全社一覧レンダリング
  renderAllDepts(allData);

  // 印刷機能初期化（全データ取得後）
  initPrint(allData);
  document.getElementById('print-btn').disabled = false;

  // ローディング非表示
  loadingOverlay.style.opacity = '0';
  loadingOverlay.style.transition = 'opacity 0.4s';
  setTimeout(() => loadingOverlay.style.display = 'none', 400);

  // 最初のタブをアクティブ化
  switchTab('all');
})();
</script>
</body>
</html>
